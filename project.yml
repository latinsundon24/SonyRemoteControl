# XcodeGen 工程描述文件（唯一真相来源）。
# macOS 上：brew install xcodegen → xcodegen generate → 生成 SonyRemoteControl.xcodeproj
name: SonyRemoteControl
options:
  bundleIdPrefix: sony.tv
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: sony.tv.remotecontrol
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  SonyRemoteControl:
    type: application
    platform: iOS
    sources:
      - path: SonyRemoteControl
    info:
      path: SonyRemoteControl/Info.plist
schemes:
  SonyRemoteControl:
    build:
      targets:
        SonyRemoteControl: all
    run:
      config: Release
