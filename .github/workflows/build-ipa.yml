name: Build IPA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (verify compilation, no signing)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project SonyRemoteControl.xcodeproj \
            -scheme SonyRemoteControl \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA (download only, not installable)
        run: |
          set -euo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SonyRemoteControl.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "App bundle not found"; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r SonyRemoteControl-unsigned.ipa Payload)
          echo "Created build/SonyRemoteControl-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyRemoteControl-unsigned
          path: build/SonyRemoteControl-unsigned.ipa
