name: Build IPA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generate App Icon set
        run: bash scripts/make-appicon.sh

      - name: Archive (no signing)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project SonyRemoteControl.xcodeproj \
            -scheme SonyRemoteControl \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/SonyRemoteControl.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA (structure complete, not installable)
        run: |
          set -euo pipefail
          APP_PATH="build/SonyRemoteControl.xcarchive/Products/Applications/SonyRemoteControl.app"
          if [ ! -d "$APP_PATH" ]; then echo "App bundle not found in archive"; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r SonyRemoteControl-unsigned.ipa Payload)
          echo "Created build/SonyRemoteControl-unsigned.ipa"
          echo "--- IPA 内容清单 ---"
          unzip -l build/SonyRemoteControl-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyRemoteControl-unsigned
          path: build/SonyRemoteControl-unsigned.ipa
